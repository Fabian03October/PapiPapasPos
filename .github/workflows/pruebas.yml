# Corre todas las pruebas en cada subida a staging o main (y en pull requests).
# Para que Railway NO publique si fallan: en Railway, en cada servicio,
# Settings → Source → activar "Wait for CI" (espera a que esto pase en verde).
name: Pruebas

on:
  push:
    branches: [staging, main]
  pull_request:

concurrency:
  group: pruebas-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pruebas:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: PosApp_testing
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -proot"
          --health-interval=5s --health-timeout=5s --health-retries=20

    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USERNAME: root
      DB_PASSWORD: root

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: bcmath, gd, gmp, intl, mbstring, pdo_mysql, zip, curl, openssl
          coverage: none

      - name: Dependencias de PHP
        run: composer install --no-interaction --prefer-dist --no-progress

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Estilos (las vistas los necesitan)
        run: npm ci && npm run build

      - name: Preparar Laravel
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Pruebas
        run: php artisan test
